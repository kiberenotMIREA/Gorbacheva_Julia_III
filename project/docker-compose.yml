# =============================================================================
# Docker Compose для Vulnerability Scoring (API + Frontend)
# =============================================================================
# Поднимает FastAPI бэкенд и React frontend (Nginx) для обнаружения уязвимостей.
#
# Порты:
#   8000:8000 — REST API (FastAPI)
#   3000:80   — Frontend (Nginx, прокси /api/* на бэкенд)
#
# Переменные окружения (API):
#   SERVICE_HOST / SERVICE_PORT — хост и порт сервиса
#   MODEL_DIR — путь к обученным моделям
#   LOG_LEVEL — уровень логирования (INFO, DEBUG, ERROR)
#
# Требуется предварительное обучение моделей:
#   docker compose run vulnerability-api python -m src.train
# Или монтирование artifacts/ с обученными моделями.
#
# Сборка:
#   docker compose build
# Запуск:
#   docker compose up -d
# Открыть в браузере:
#   http://localhost:3000
# =============================================================================

services:
  # --- Бэкенд: FastAPI сервис обнаружения уязвимостей ---------------------------
  vulnerability-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnerability-scoring-api
    ports:
      - "8000:8000"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - MODEL_DIR=/app/artifacts/models
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=-1
      - TF_ENABLE_ONEDNN_OPTS=0
      - TF_CPP_MIN_LOG_LEVEL=2
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Frontend: React (Vite + Nginx) ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnerability-scoring-frontend
    ports:
      - "3000:80"
    depends_on:
      vulnerability-api:
        condition: service_healthy
    restart: unless-stopped
