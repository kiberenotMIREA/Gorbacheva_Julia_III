# =============================================================================
# Nginx config для Vulnerability Scoring Frontend
# =============================================================================
# Проксирует /api/* на бэкенд FastAPI, статику отдает напрямую.
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Статика React (сборка Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси на бэкенд FastAPI
    location /api/ {
        proxy_pass http://vulnerability-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
